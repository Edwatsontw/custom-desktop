<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal Desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--desk); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--phosphor); }
  .win { fill:var(--line); }
  .focus { fill:var(--focus); }
  .warn { fill:var(--warn); }
  .ink { fill:var(--ink); }
  .dot { fill:var(--phosphor); }
  .blk { rx:var(--radius-md); }
  .winr { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      line 240×176 as a floating window (radius-lg) with a phosphor block cursor 16×24 inside · phosphor slab 112×232 bleeding off top and right (the brand) · bottom strip of unequal bands: focus 152×40, warn 72×40, ink 112×40 bleeding right — ≈29% of 960×288
  arrangement one window over the desk, the phosphor slab behind it at the edge, a strip of state colours beneath like a taskbar
  pattern     dot grid in phosphor at space-4 pitch (54 dots), from "4px grid, mono, terminal is the wallpaper": the character cells of the terminal underneath
  scales      sides in space-2 multiples; gutters space-4; dot pitch space-4; corners radius-md (blocks), radius-lg (window)
-->
<g>
  <circle class="dot" cx="16" cy="104" r="2"/><circle class="dot" cx="32" cy="104" r="2"/><circle class="dot" cx="48" cy="104" r="2"/><circle class="dot" cx="64" cy="104" r="2"/><circle class="dot" cx="80" cy="104" r="2"/><circle class="dot" cx="96" cy="104" r="2"/>
  <circle class="dot" cx="16" cy="120" r="2"/><circle class="dot" cx="32" cy="120" r="2"/><circle class="dot" cx="48" cy="120" r="2"/><circle class="dot" cx="64" cy="120" r="2"/><circle class="dot" cx="80" cy="120" r="2"/><circle class="dot" cx="96" cy="120" r="2"/>
  <circle class="dot" cx="16" cy="136" r="2"/><circle class="dot" cx="32" cy="136" r="2"/><circle class="dot" cx="48" cy="136" r="2"/><circle class="dot" cx="64" cy="136" r="2"/><circle class="dot" cx="80" cy="136" r="2"/><circle class="dot" cx="96" cy="136" r="2"/>
  <circle class="dot" cx="16" cy="152" r="2"/><circle class="dot" cx="32" cy="152" r="2"/><circle class="dot" cx="48" cy="152" r="2"/><circle class="dot" cx="64" cy="152" r="2"/><circle class="dot" cx="80" cy="152" r="2"/><circle class="dot" cx="96" cy="152" r="2"/>
  <circle class="dot" cx="16" cy="168" r="2"/><circle class="dot" cx="32" cy="168" r="2"/><circle class="dot" cx="48" cy="168" r="2"/><circle class="dot" cx="64" cy="168" r="2"/><circle class="dot" cx="80" cy="168" r="2"/><circle class="dot" cx="96" cy="168" r="2"/>
  <circle class="dot" cx="16" cy="184" r="2"/><circle class="dot" cx="32" cy="184" r="2"/><circle class="dot" cx="48" cy="184" r="2"/><circle class="dot" cx="64" cy="184" r="2"/><circle class="dot" cx="80" cy="184" r="2"/><circle class="dot" cx="96" cy="184" r="2"/>
  <circle class="dot" cx="16" cy="200" r="2"/><circle class="dot" cx="32" cy="200" r="2"/><circle class="dot" cx="48" cy="200" r="2"/><circle class="dot" cx="64" cy="200" r="2"/><circle class="dot" cx="80" cy="200" r="2"/><circle class="dot" cx="96" cy="200" r="2"/>
  <circle class="dot" cx="16" cy="216" r="2"/><circle class="dot" cx="32" cy="216" r="2"/><circle class="dot" cx="48" cy="216" r="2"/><circle class="dot" cx="64" cy="216" r="2"/><circle class="dot" cx="80" cy="216" r="2"/><circle class="dot" cx="96" cy="216" r="2"/>
  <circle class="dot" cx="16" cy="232" r="2"/><circle class="dot" cx="32" cy="232" r="2"/><circle class="dot" cx="48" cy="232" r="2"/><circle class="dot" cx="64" cy="232" r="2"/><circle class="dot" cx="80" cy="232" r="2"/><circle class="dot" cx="96" cy="232" r="2"/>
</g>
<rect class="brand blk" x="384" y="-16" width="112" height="232" rx="8"/>
<rect class="win winr" x="128" y="40" width="240" height="176" rx="12"/>
<rect class="brand" x="152" y="168" width="16" height="24"/>
<rect class="focus blk" x="128" y="232" width="152" height="40" rx="8"/>
<rect class="warn blk" x="296" y="232" width="72" height="40" rx="8"/>
<rect class="ink blk" x="384" y="232" width="112" height="40" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Terminal Desktop</h1>
<p class="tag">The terminal is the wallpaper: you can see it, and type into it.</p>
</div>
</div>
</body>
</html>
